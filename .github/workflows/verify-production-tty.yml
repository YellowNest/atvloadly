name: Verify production TTY fix

on:
  push:
    branches:
      - verify/disable-production-tty

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Run Go tests
        run: go test ./...
