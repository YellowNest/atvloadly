name: Verify production TTY fix

on:
  push:
    branches:
      - verify/disable-production-tty

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build frontend
        run: cd web/static && npm install && npm test && npm run build
      - name: Run Go tests
        run: go test ./...
